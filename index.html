
<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Tola Ai</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;padding:0;width:100%;min-height:100%;
background:#080808;color:#f5f5f5;font-family:Arial,sans-serif;
}
body{min-height:100vh;min-height:100dvh;padding-bottom:85px}
header{text-align:center;padding:20px 12px 16px;background:#111;border-bottom:1px solid #292929}
header h1{
margin:0;font-size:37px;font-weight:900;letter-spacing:1px;
background:linear-gradient(90deg,#00e5ff,#a855f7,#facc15,#00e5ff);
background-size:250% auto;-webkit-background-clip:text;
background-clip:text;color:transparent;animation:shine 5s linear infinite
}
@keyframes shine{to{background-position:250% center}}
.toolbar{display:flex;justify-content:center;align-items:center;padding:11px 10px;background:#101010;border-bottom:1px solid #292929}
.new-chat{background:#262626;color:white;border:1px solid #404040;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer}
.container{width:100%;max-width:850px;margin:auto;padding:12px 12px 20px}
.folder-row{display:flex;justify-content:center;align-items:flex-start;gap:11px;width:100%;margin:8px auto 17px}
.folder{width:min(45%,210px);background:#191919;border:1px solid #414141;border-radius:13px;overflow:hidden;min-height:45px;box-shadow:0 3px 12px #0005}
.folder summary{list-style:none;padding:12px 8px;cursor:pointer;text-align:center;color:#f5f5f5;font-size:14px;font-weight:bold}
.folder summary::-webkit-details-marker{display:none}
.folder summary:after{content:"  ＋";color:#facc15;font-size:15px}
.folder[open] summary:after{content:"  −"}
.folder-content{padding:5px 8px 10px;display:grid;gap:7px}
.folder-content button{width:100%;min-height:37px;padding:8px 6px;background:#292929;border:1px solid #454545;color:#eee;border-radius:8px;text-align:center;font-size:12px;cursor:pointer}
.folder-content button:active{background:#0756a8}
#chatMessages{margin-top:12px;padding-bottom:12px}
.message{margin:13px 0;padding:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.user{background:#0756a8;color:white;border-radius:14px;margin-left:25px;border:1px solid #218be8}
.ai{background:transparent;color:#f5f5f5;border:0;margin-right:5px;padding:12px 3px;box-shadow:none}
.message-actions{display:flex;gap:8px;margin-top:10px}
.message-actions button{background:#202020;color:#ddd;border:1px solid #414141;border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer}
.input-area{position:fixed;left:0;right:0;bottom:0;z-index:999;width:100%;margin:0;padding:7px 10px;padding-bottom:calc(7px + env(safe-area-inset-bottom));background:#080808;border:0}
.input-inner{width:100%;max-width:800px;margin:0 auto;display:flex;align-items:flex-end;gap:7px;padding:6px 7px;background:#303030;border:1px solid #555;border-radius:20px;box-shadow:0 3px 15px #0009}
#question{display:block;flex:1;width:100%;min-width:0;min-height:38px;max-height:120px;resize:none;overflow-y:auto;background:transparent;color:#fff;border:0;padding:9px 8px;font-size:16px;line-height:1.4;outline:none;font-family:Arial,sans-serif}
#question::placeholder{color:#c0c0c0}
#send{width:39px;height:39px;flex-shrink:0;border:1px solid #b8860b;border-radius:50%;background:linear-gradient(145deg,#facc15,#b8860b);color:#080808;font-size:22px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
#send:disabled{opacity:.45}
#status{text-align:center;color:#b5b5b5;font-size:12px;min-height:17px;padding:0 3px 3px}
.typing-dots{display:inline-flex;gap:5px;align-items:center}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:#facc15;animation:pulse 1s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@media(max-width:360px){
header h1{font-size:33px}
.folder-row{gap:8px}
.folder{width:46%}
.folder summary{font-size:12px;padding:12px 4px}
.folder-content{padding:5px 6px 8px}
.folder-content button{font-size:11px}
.message{font-size:14px}
}
@media(prefers-reduced-motion:reduce){
header h1{animation:none}
.typing-dots span{animation:none}
}
</style>
</head>

<body>
<header><h1>Tola Ai</h1></header>

<div class="toolbar">
<button class="new-chat" onclick="newConversation()">＋ Haaraa</button>
</div>

<main class="container">
<section class="folder-row">
<details class="folder">
<summary>🌐 Afaan</summary>
<div class="folder-content">
<button onclick="setLanguage('om')">Afaan Oromoo</button>
<button onclick="setLanguage('am')">አማርኛ</button>
<button onclick="setLanguage('en')">English</button>
</div>
</details>

<details class="folder">
<summary>📚 Barnoota</summary>
<div class="folder-content">
<button onclick="askTopic('Herrega na barsiisi.')">📐 Herrega</button>
<button onclick="askTopic('Saayinsii na barsiisi.')">🧪 Saayinsii</button>
<button onclick="askTopic('Afaan Oromoo na barsiisi.')">📖 Afaan Oromoo</button>
<button onclick="askTopic('English na barsiisi.')">🇬🇧 English</button>
<button onclick="askTopic('Afaan Amaaraa na barsiisi.')">🇪🇹 Afaan Amaaraa</button>
<button onclick="askTopic('Hawaasummaa na barsiisi.')">🌍 Hawaasummaa</button>
<button onclick="askTopic('ICT na barsiisi.')">💻 ICT</button>
<button onclick="askTopic('Beekumsa waliigalaa na barsiisi.')">💡 Beekumsa Waliigalaa</button>
</div>
</details>
</section>

<section id="chatMessages"></section>
</main>

<div class="input-area">
<div id="status"></div>
<div class="input-inner">
<textarea id="question" placeholder="Gaaffii kee barreessi..." rows="1"
oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
<button id="send" onclick="sendMessage()" aria-label="Ergi">↑</button>
</div>
</div>

<script>
let history = [];
let language = "om";
let busy = false;

const messages = document.getElementById("chatMessages");
const question = document.getElementById("question");
const sendButton = document.getElementById("send");
const statusBox = document.getElementById("status");

function resizeInput(element){
  element.style.height = "38px";
  element.style.height = Math.min(element.scrollHeight,120) + "px";
}

function setLanguage(code){
  language = code;
  const placeholders = {
    om:"Gaaffii kee barreessi...",
    am:"ጥያቄህን እዚህ ጻፍ...",
    en:"Write your question here..."
  };
  question.placeholder = placeholders[code] || placeholders.om;
}

function isNameQuestion(text){
  const q = text.toLowerCase().trim();
  const patterns = [
    /maqaan kee eenyu/,
    /ati eenyu/,
    /maqaa kee natti himi/,
    /eenyu si/,
    /who are you/,
    /what is your name/,
    /your name/,
    /ማን ነህ/,
    /ስምህ ማን ነው/
  ];
  return patterns.some(pattern => pattern.test(q));
}

/* Barruu deebii saffisaan agarsiisa */
function typeText(element,text){
  return new Promise(function(resolve){
    let position = 0;
    const reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if(reduced){
      element.textContent = text;
      resolve();
      return;
    }

    function draw(){
      position = Math.min(position + 72,text.length);
      element.textContent = text.slice(0,position);

      if(position < text.length){
        requestAnimationFrame(draw);
      }else{
        resolve();
      }
    }

    draw();
  });
}

function addMessage(text,type,animated){
  const div = document.createElement("div");
  div.className = "message " + type;

  const content = document.createElement("div");
  div.appendChild(content);

  messages.appendChild(div);

  const renderPromise = animated
    ? typeText(content,text)
    : Promise.resolve(content.textContent = text);

  if(type === "ai"){
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.textContent = "📋 Copy";

    copy.onclick = function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text)
          .then(function(){
            statusBox.textContent = "Deebiin copy ta'eera.";
          })
          .catch(function(){
            statusBox.textContent = "Copy gochuun hin danda'amne.";
          });
      }else{
        statusBox.textContent = "Copy hin danda'amne.";
      }
    };

    actions.appendChild(copy);
    div.appendChild(actions);
  }

  requestAnimationFrame(function(){
    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });
  });

  return renderPromise;
}

function showTyping(){
  statusBox.innerHTML =
    '<span class="typing-dots"><span></span><span></span><span></span></span> Tola AI deebii qopheessaa jira...';
}

function handleKey(event){
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

function askTopic(text){
  if(busy) return;
  question.value = text;
  resizeInput(question);
  sendMessage();
}

function sendMessage(){
  if(busy) return;

  const text = question.value.trim();
  if(!text){
    question.focus();
    return;
  }

  busy = true;
  sendButton.disabled = true;
  question.value = "";
  resizeInput(question);

  addMessage(text,"user",false);
  showTyping();

  if(isNameQuestion(text)){
    const answer = language === "en"
      ? "I am Tola Ai."
      : language === "am"
      ? "እኔ ቶላ AI ነኝ።"
      : "Ani Tola Ai dha.";

    statusBox.textContent = "";
    addMessage(answer,"ai",true).then(finish);

    history.push(
      {role:"user",text:text},
      {role:"model",text:answer}
    );
    history = history.slice(-16);
    return;
  }

  if(typeof google === "undefined" ||
     !google.script ||
     !google.script.run){
    statusBox.textContent = "";
    addMessage("Web App sirriitti bani.","ai",false);
    finish();
    return;
  }

  const previousHistory = history.slice(-8);

  google.script.run
    .withSuccessHandler(function(reply){
      if(reply && String(reply).trim()){
        const answer = String(reply);

        history.push(
          {role:"user",text:text},
          {role:"model",text:answer}
        );
        history = history.slice(-16);

        statusBox.textContent = "";
        addMessage(answer,"ai",true).then(finish);
      }else{
        statusBox.textContent = "";
        addMessage(
          "Deebii argachuun hin danda'amne. Irra deebi'ii yaali.",
          "ai",false
        );
        finish();
      }
    })
    .withFailureHandler(function(error){
      const errorText = error && error.message
        ? error.message
        : "Rakkoo hin beekamne.";

      statusBox.textContent = "";
      addMessage(
        "Dhiifama, deebii argachuu hin dandeenye.\n" + errorText,
        "ai",false
      );
      finish();
    })
    .askGemini(text,language,previousHistory);
}

function finish(){
  busy = false;
  sendButton.disabled = false;
  statusBox.textContent = "";
  question.focus();
}

function newConversation(){
  if(busy) return;

  history = [];
  messages.innerHTML = "";
  question.value = "";
  resizeInput(question);
  statusBox.textContent = "";
  question.focus();
}
</script>
</body>
</html>
