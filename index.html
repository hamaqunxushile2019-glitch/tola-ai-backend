
<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>Tola Ai</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b12;
 color:#fff;
 font-family:Arial,sans-serif;
 font-size:16px;
 min-height:100vh;
 display:flex;
 flex-direction:column;
}
header{
 background:#101827;
 padding:13px 12px;
 border-bottom:1px solid #26344a;
 position:sticky;
 top:0;
 z-index:10;
}
.header-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
}
.logo{
 font-size:25px;
 font-weight:bold;
 letter-spacing:.5px;
 background:linear-gradient(90deg,#00e5ff,#a855f7,#facc15);
 -webkit-background-clip:text;
 color:transparent;
}
.folders{
 display:flex;
 align-items:center;
 justify-content:flex-end;
 gap:5px;
}
.folder{
 width:39px;
 height:37px;
 border:1px solid #34445d;
 border-radius:10px;
 background:#1b2940;
 color:white;
 font-size:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer;
}
.folder:active{transform:scale(.94)}
.folder.active{
 background:#075985;
 border-color:#0ea5e9;
}
.dropdown{
 display:none;
 position:absolute;
 right:10px;
 top:62px;
 min-width:165px;
 background:#17243a;
 border:1px solid #34445d;
 border-radius:12px;
 padding:7px;
 box-shadow:0 8px 25px #0009;
 z-index:20;
}
.dropdown.show{display:block}
.dropdown button{
 display:block;
 width:100%;
 padding:12px 10px;
 margin:3px 0;
 border:0;
 border-radius:8px;
 background:#22334d;
 color:white;
 text-align:left;
 font-size:15px;
}
.dropdown button:active{background:#0369a1}
#returnButton{
 display:none;
 width:100%;
 padding:10px;
 margin-top:12px;
 background:#000;
 color:#fff;
 border:1px solid #555;
 border-radius:9px;
 font-size:15px;
 text-align:left;
}
main{
 flex:1;
 width:100%;
 max-width:850px;
 margin:auto;
 padding:12px;
 display:flex;
 flex-direction:column;
}
#welcome{
 text-align:center;
 margin:35px 8px 20px;
}
#welcome h2{
 color:#38bdf8;
 font-size:24px;
}
#welcome p{
 color:#aebbd0;
 line-height:1.7;
}
#chatMessages{
 display:flex;
 flex-direction:column;
 gap:13px;
 padding-bottom:15px;
}
.message{
 max-width:90%;
 padding:13px 15px;
 border-radius:15px;
 line-height:1.65;
 font-size:16px;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 align-self:flex-end;
 background:#075985;
 border-bottom-right-radius:4px;
}
.ai{
 align-self:flex-start;
 background:#17243a;
 border:1px solid #293a52;
 border-bottom-left-radius:4px;
}
.message small{
 display:block;
 font-size:11px;
 color:#aabbd1;
 margin-bottom:5px;
}
#typing{
 display:none;
 color:#38bdf8;
 padding:10px;
 font-size:14px;
}
.composer{
 position:sticky;
 bottom:65px;
 background:#080b12;
 padding:10px 0;
 margin-top:auto;
}
.input-row{
 display:flex;
 align-items:flex-end;
 gap:8px;
}
#question{
 flex:1;
 min-width:0;
 min-height:50px;
 max-height:150px;
 resize:none;
 border:1px solid #0284c7;
 background:#10243b;
 color:white;
 border-radius:13px;
 padding:13px;
 font-size:16px;
 outline:none;
}
#question::placeholder{color:#9db2ca}
#send{
 width:50px;
 height:50px;
 flex-shrink:0;
 border:0;
 border-radius:13px;
 background:#0284c7;
 color:white;
 font-size:24px;
 cursor:pointer;
}
#send:disabled{opacity:.5}
#statusBox{
 min-height:20px;
 padding:5px 3px;
 color:#fbbf24;
 font-size:12px;
}
footer{
 position:sticky;
 bottom:0;
 background:#101827;
 border-top:1px solid #26344a;
 display:flex;
 justify-content:space-around;
 padding:10px 5px;
 z-index:5;
}
footer button{
 background:transparent;
 border:0;
 color:#b8c6da;
 font-size:14px;
 padding:5px 12px;
}
footer button.active{color:#38bdf8}
#settingsPanel{
 display:none;
 position:fixed;
 inset:0;
 z-index:50;
 background:#000b;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.settings-content{
 width:100%;
 max-width:400px;
 background:#17243a;
 border:1px solid #34445d;
 border-radius:15px;
 padding:20px;
}
.settings-content h3{color:#38bdf8}
.settings-content button{
 width:100%;
 padding:12px;
 margin:5px 0;
 border:0;
 border-radius:9px;
 background:#263b56;
 color:white;
 font-size:15px;
}
#clearHistory{background:#991b1b}
.hidden{display:none!important}
@media(max-width:400px){
 .logo{font-size:22px}
 .folder{width:35px;height:35px}
 .folders{gap:4px}
 main{padding:9px}
}
</style>
</head>

<body>

<header>
 <div class="header-top">
  <div class="logo">Tola Ai</div>

  <div class="folders">

   <button class="folder" id="languageFolder"
   aria-label="Afaan filadhu" title="Afaan"
   onclick="toggleMenu('languageMenu',this)">🌐</button>

   <button class="folder" id="subjectFolder"
   aria-label="Gosa barnootaa filadhu" title="Gosa barnootaa"
   onclick="toggleMenu('subjectMenu',this)">📚</button>

   <button class="folder" id="gameFolder"
   aria-label="Bashannana" title="Bashannana"
   onclick="toggleMenu('gameMenu',this)">🎮</button>

  </div>
 </div>

 <div class="dropdown" id="languageMenu">
  <button onclick="setLanguage('om','Afaan Oromoo')">Afaan Oromoo</button>
  <button onclick="setLanguage('am','አማርኛ')">አማርኛ</button>
  <button onclick="setLanguage('en','English')">English</button>
 </div>

 <div class="dropdown" id="subjectMenu">
  <button onclick="setSubject('Barnoota waliigalaa')">Barnoota waliigalaa</button>
  <button onclick="setSubject('Herrega')">Herrega</button>
  <button onclick="setSubject('Physics')">Physics</button>
  <button onclick="setSubject('Chemistry')">Chemistry</button>
  <button onclick="setSubject('Biology')">Biology</button>
  <button onclick="setSubject('English')">English</button>
  <button onclick="setSubject('Afaan Oromoo')">Afaan Oromoo</button>
  <button onclick="setSubject('Geography')">Geography</button>
  <button onclick="setSubject('History')">History</button>
 </div>

 <div class="dropdown" id="gameMenu">
  <button onclick="ask('Gaaffii beekumsa waliigalaa 5 na gaafadhu.')">🧠 Gaaffii beekumsaa</button>
  <button onclick="ask('Tapha jechootaa na waliin taphadhu.')">🔤 Tapha jechootaa</button>
  <button onclick="ask('Gaaffii herregaa salphaa naaf kenni.')">➗ Tapha herregaa</button>
  <button onclick="ask('Seenaa gabaabaa nama barsiisu naaf himi.')">📖 Seenaa gabaabaa</button>
 </div>

 <button id="returnButton" onclick="newChat()"></button>
</header>

<main>

 <section id="welcome">
  <h2></h2>
  <p>
  </p>
 </section>

 <div id="chatMessages"></div>
 <div id="typing">Eegi...</div>

 <section class="composer">
  <div class="input-row">
   <textarea id="question"
    placeholder=
></textarea>
   <button id="send" onclick="sendMessage()">➤</button>
  </div>
  <div id="statusBox"></div>
 </section>

</main>

<footer>
 <button class="active" onclick="newChat()">＋ Haaraa</button>
 <button onclick="showSettings()">⚙️ Qindaa'ina</button>
</footer>

<div id="settingsPanel" onclick="closeSettingsOutside(event)">
 <div class="settings-content">
  <h3>⚙️ Qindaa'ina Tola Ai</h3>
  <p id="currentLanguage">Afaan: Afaan Oromoo</p>
  <p id="currentSubject">Gosa barnootaa: Waliigalaa</p>
  <button onclick="newChat();hideSettings()">Mari'aa haaraa jalqabi</button>
  <button id="clearHistory" onclick="clearHistory()">Seenaa marii haqi</button>
  <button onclick="hideSettings()">Cufi</button>
 </div>
</div>

<script>
 const API_URL = "https://tola-ai-new.hamaqunxushile2019.workers.dev/";
"use strict";

/* QINDAA'INA SERVERII */

let language = "om";
let languageName = "Afaan Oromoo";
let subject = "Barnoota waliigalaa";
let history = [];
let busy = false;

const question = document.getElementById("question");
const sendButton = document.getElementById("send");
const chatMessages = document.getElementById("chatMessages");
const welcome = document.getElementById("welcome");
const typing = document.getElementById("typing");
const statusBox = document.getElementById("statusBox");

/* SEENAA MARII */

try {
 history = JSON.parse(localStorage.getItem("tola_history") || "[]");
 if (!Array.isArray(history)) history = [];
} catch(e) {
 history = [];
}

function saveHistory(){
 try{
  localStorage.setItem("tola_history",JSON.stringify(history));
 }catch(e){}
}

/* MENU FOLDER */

function toggleMenu(id,button){
 const menu=document.getElementById(id);
 const wasOpen=menu.classList.contains("show");

 document.querySelectorAll(".dropdown").forEach(m=>{
  m.classList.remove("show");
 });

 document.querySelectorAll(".folder").forEach(b=>{
  b.classList.remove("active");
 });

 if(!wasOpen){
  menu.classList.add("show");
  button.classList.add("active");
 }
}

document.addEventListener("click",function(e){
 if(!e.target.closest(".folders") &&
    !e.target.closest(".dropdown")){
  document.querySelectorAll(".dropdown").forEach(m=>{
   m.classList.remove("show");
  });
  document.querySelectorAll(".folder").forEach(b=>{
   b.classList.remove("active");
  });
 }
});

/* AFAAN FILADHU */

function setLanguage(code,name){
 language=code;
 languageName=name;

 document.getElementById("currentLanguage").textContent=
 "Afaan: "+name;

 closeMenus();
 statusBox.textContent="Afaan "+name+" filatameera.";
}

/* GOSA BARNOOTAA FILADHU */

function setSubject(name){
 subject=name;

 document.getElementById("currentSubject").textContent=
 "Gosa barnootaa: "+name;

 closeMenus();
 statusBox.textContent=name+" filatameera.";
}

function closeMenus(){
 document.querySelectorAll(".dropdown").forEach(m=>{
  m.classList.remove("show");
 });
 document.querySelectorAll(".folder").forEach(b=>{
  b.classList.remove("active");
 });
}

/* ERGAA AGARSIISUU */

function addMessage(text,type){
 const box=document.createElement("div");
 box.className="message "+type;

 const label=document.createElement("small");
 label.textContent=type==="user"?"

 const content=document.createElement("div");
 content.textContent=text;

 box.appendChild(label);
 box.appendChild(content);

 chatMessages.appendChild(box);

 window.scrollTo({
  top:document.body.scrollHeight,
  behavior:"smooth"
 });
}

function showChat(){
 welcome.style.display="none";
 document.getElementById("returnButton").style.display="block";
}

function newChat(){
 history=[];
 chatMessages.innerHTML="";
 welcome.style.display="block";
 document.getElementById("returnButton").style.display="none";
 saveHistory();
 statusBox.textContent=
 question.focus();
}

/* SEENAA DEEBISUU */

function restoreHistory(){
 if(history.length===0)return;

 showChat();

 history.forEach(item=>{
  if(item.role==="user"){
   addMessage(item.content,"user");
  }else if(item.role==="assistant"){
   addMessage(item.content,"ai");
  }
 });
}

/* ERGAA SERVERIIF ERGUU */

async function requestWithRetry(payload){
 let lastError;

 for(let attempt=0;attempt<2;attempt++){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),45000);

  try{
   const response=await fetch(API_URL,{
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify(payload),
    signal:controller.signal
   });

   clearTimeout(timeout);

   const raw=await response.text();
   let data;

   try{
    data=JSON.parse(raw);
   }catch(e){
    throw new Error("Deebiin serverii sirrii miti. HTTP "+response.status);
   }

   if(!response.ok){
    const err=new Error(
     data.error || data.message || "Server error "+response.status
    );
    err.status=response.status;
    throw err;
   }

   return data;

  }catch(error){
   clearTimeout(timeout);
   lastError=error;

   if(error.name==="AbortError"){
    lastError=new Error("Serveriin yeroo dheeraa fudhate.");
   }

   const status=error.status;
   const retryable=
    !status || [429,500,502,503,504].includes(status);

   if(!retryable || attempt===1)break;

   await new Promise(resolve=>setTimeout(resolve,1500));
  }
 }

 throw lastError;
}

/* ERGAA ERGUU */

async function sendMessage(){
 const message=question.value.trim();

 if(!message || busy)return;

 busy=true;
 sendButton.disabled=true;
 typing.style.display="block";
 statusBox.textContent=
 showChat();

 addMessage(message,"user");

 history.push({
  role:"user",
  content:message
 });

 question.value="";
 question.style.height="50px";

 const payload={
  message:message,
  language:language,
  subject:subject,
  history:history.slice(-12)
 };

 try{
  const data=await requestWithRetry(payload);

  const reply=
   data.reply || data.answer || data.text ||
   data.response || "";

  if(!reply){
   throw new Error("Deebiin serverii duwwaa dha.");
  }

  addMessage(String(reply),"ai");

  history.push({
   role:"assistant",
   content:String(reply)
  });

  history=history.slice(-24);
  saveHistory();

  statusBox.textContent="Deebiin argameera.";

 }catch(error){
  let message="Dhiifama, deebii argachuu hin dandeenye.";

  if(error.name==="AbortError"){
   message="Serveriin yeroo dheeraa fudhate. Irra deebi'ii yaali.";
  }else if(error.status===429){
   message="Gaaffiin serverii baay'ateera. Booda irra deebi'ii yaali.";
  }else if(error.status===502 || error.status===503 ||
           error.status===504){
   message="Serveriin yeroo ammaa deebii kennuu hin dandeenye. Xiqqoo booda yaali.";
  }else{
   message+=" "+error.message;
  }

  addMessage(message,"ai");
  statusBox.textContent="Walqunnamtiin serverii rakkoo qaba.";
 }finally{
  busy=false;
  sendButton.disabled=false;
  typing.style.display="none";
  question.focus();
 }
}

/* ENTER TUQII ERGI */

question.addEventListener("keydown",function(e){
 if(e.key==="Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

/* BAL'INA BOXII BARREESSUU */

question.addEventListener("input",function(){
 this.style.height="30px";
 this.style.height=Math.min(this.scrollHeight,100)+"px";
});

/* GAFFII FOLDER IRRAA */

function ask(text){
 question.value=text;
 closeMenus();
 sendMessage();
}

/* QINDAA'INA */

function showSettings(){
 document.getElementById("settingsPanel").style.display="flex";
}

function hideSettings(){
 document.getElementById("settingsPanel").style.display="none";
}

function closeSettingsOutside(event){
 if(event.target.id==="settingsPanel"){
  hideSettings();
 }
}

/* SEENAA HAQUU */

function clearHistory(){
 if(!confirm("Seenaa marii hunda haquu barbaaddaa?"))return;

 history=[];
 saveHistory();
 chatMessages.innerHTML="";
 welcome.style.display="block";
 document.getElementById("returnButton").style.display="none";
 hideSettings();
 statusBox.textContent="Seenaa marii haqameera.";
}

/* JALQABA */

restoreHistory();

</script>
</body>
 </html>
