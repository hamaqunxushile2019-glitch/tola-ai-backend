
<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Tola AI</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #101827;
  color: #f1f5f9;
  font-family: Arial, sans-serif;
  font-size: 16px;
}

body {
  min-height: 100dvh;
}

header {
  background: #17243a;
  padding: 10px;
  border-bottom: 1px solid #334155;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 5;
}

.logo-image {
  display: block;
  width: 80px;
  height: 80px;
  object-fit: contain;
  margin: 0 auto;
  border-radius: 12px;
}

h1 {
  margin: 8px 0 0;
  font-size: 28px;
  background: linear-gradient(90deg, #facc15, #38bdf8, #c084fc);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.sub {
  color: #cbd5e1;
  font-size: 13px;
  margin-top: 5px;
}

main {
  max-width: 760px;
  margin: auto;
  padding: 15px;
  padding-bottom: 120px;
}

.welcome {
  text-align: center;
  padding: 22px 8px;
}

.robot {
  font-size: 48px;
}

h2 {
  color: #38bdf8;
}

.welcome p {
  color: #cbd5e1;
  line-height: 1.7;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.language-menu {
  position: relative;
  text-align: center;
  margin: 18px 0;
}

.language-toggle {
  background: linear-gradient(90deg, #0284c7, #7c3aed);
  color: white;
  border: 0;
  padding: 12px 24px;
  border-radius: 22px;
  font-size: 16px;
}

.language-options {
  margin-top: 9px;
}

.language-options button {
  display: block;
  margin: 7px auto;
  min-width: 180px;
  padding: 11px 20px;
  border-radius: 18px;
  background: #1e293b;
  color: white;
  border: 1px solid #475569;
}

.language-options button.active {
  background: #0284c7;
  border-color: #38bdf8;
}

.suggestions {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 18px 0;
}

.suggestions button {
  background: #1e293b;
  color: white;
  border: 1px solid #475569;
  padding: 10px 13px;
  border-radius: 20px;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding-bottom: 15px;
}

.msg {
  padding: 13px 15px;
  border-radius: 17px;
  max-width: 92%;
  white-space: pre-wrap;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #075985;
}

.ai {
  align-self: flex-start;
  background: #1e293b;
  border: 1px solid #334155;
}

.label {
  font-size: 12px;
  color: #7dd3fc;
  margin-bottom: 6px;
}

.status {
  text-align: center;
  padding: 9px;
  color: #94a3b8;
  font-size: 12px;
}

/* Saanduqa ergaa jala bilbilaatti */
.composer {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 760px;
  background: #101827;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  z-index: 100;
  border-top: 1px solid #334155;
}

.inputbox {
  display: flex;
  gap: 7px;
  align-items: flex-end;
  background: #1e293b;
  border: 1px solid #475569;
  border-radius: 18px;
  padding: 8px;
}

textarea {
  background: transparent;
  color: white;
  border: 0;
  outline: 0;
  resize: none;
  min-height: 45px;
  max-height: 140px;
  flex: 1;
  min-width: 0;
  font: 16px Arial;
  padding: 10px 4px;
}

.voice-btn {
  border: 0;
  border-radius: 13px;
  background: #334155;
  color: white;
  padding: 12px;
  font-size: 19px;
  min-width: 43px;
  min-height: 43px;
}

.voice-btn:active {
  background: #0284c7;
}

.voice-btn.listening {
  background: #dc2626;
}

#send {
  border: 0;
  border-radius: 13px;
  background: #0284c7;
  color: white;
  padding: 13px 15px;
  font-size: 16px;
  min-height: 43px;
}

#send:disabled {
  opacity: .5;
}

footer {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  padding: 20px;
  margin-bottom: 85px;
}
</style>
</head>

<body>

<header>
  <img
    class="logo-image"
    src="file_00000000541081f5acdd80f1182cdd58.png"
    alt="Tola AI Logo"
  >
  <h1>Tola AI</h1>
  <div class="sub">Barnootaaf</div>
</header>

<main>

  <section class="welcome" id="welcome">
    <div class="robot">🤖</div>
    <h2>Baga Nagaan dhufte!</h2>
    <p>Waan barbaadde na gaafadhu!</p>
    <p>🎤 Sagaleedhaanis na gaafachuu dandeessa.</p>
  </section>

  <div class="language-menu">
    <button
      class="language-toggle"
      type="button"
      onclick="toggleLanguages()"
    >
      🌐 Afaan ▼
    </button>

    <div
      id="languageOptions"
      class="language-options"
      style="display:none;"
    >
      <button class="active" onclick="setLanguage('om',this)">
        Afaan Oromoo
      </button>
      <button onclick="setLanguage('am',this)">
        አማርኛ
      </button>
      <button onclick="setLanguage('en',this)">
        English
      </button>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button onclick="ask('Saayinsiin maal jechuudha?')">
      🔬 Saayinsii
    </button>
    <button onclick="ask('Herrega na barsiisi')">
      ➗ Herrega
    </button>
    <button onclick="ask('Seenaa na barsiisi')">
      📚 Seenaa
    </button>
    <button onclick="ask('English na barsiisi')">
      🌍 Afaan
    </button>
  </div>

  <section id="chat"></section>

  <div class="status" id="status">
    👇 Tola AI si dhaggeeffachuuf qophaa'a.
  </div>

</main>

<div class="composer">
  <div class="inputbox">

    <button
      id="micButton"
      class="voice-btn"
      type="button"
      onclick="startVoiceInput()"
      title="Sagaleedhaan dubbadhu"
    >🎤</button>

    <textarea
      id="question"
      placeholder="Tola AI gaafadhu..."
      rows="1"
    ></textarea>

    <button
      id="speakButton"
      class="voice-btn"
      type="button"
      onclick="speakLastAnswer()"
      title="Deebii dhaggeeffadhu"
    >🔊</button>

    <button
      id="send"
      type="button"
      onclick="sendMessage()"
    >➤</button>

  </div>
</div>

<footer>Tola AI © Hama 2026</footer>

<script>
const API_URL =
"https://tola-ai-chat-2026.hamaqunxushile2019.workers.dev/";

const chat = document.getElementById("chat");
const question = document.getElementById("question");
const sendButton = document.getElementById("send");
const statusBox = document.getElementById("status");
const micButton = document.getElementById("micButton");

let language = "om";
let history = [];
let busy = false;
let lastAnswer = "";
let recognition = null;
let isListening = false;

function toggleLanguages() {
  const menu = document.getElementById("languageOptions");

  menu.style.display =
    menu.style.display === "none" ? "block" : "none";
}

function setLanguage(lang, button) {
  language = lang;

  document
    .querySelectorAll("#languageOptions button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  question.placeholder = {
    om: "Tola AI gaafadhu...",
    am: "Tola AIን ይጠይቁ...",
    en: "Ask Tola AI..."
  }[lang];

  statusBox.textContent = {
    om: "Afaan Oromoo filatte.",
    am: "አማርኛ መርጠዋል።",
    en: "English selected."
  }[lang];

  document.getElementById("languageOptions").style.display = "none";
  question.focus();
}

function addMessage(text, type) {
  const box = document.createElement("div");
  box.className = "msg " + type;

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = type === "user" ? "Ana" : "Tola AI";

  const content = document.createElement("div");
  content.textContent = text;

  box.append(label, content);
  chat.appendChild(box);

  box.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });

  return box;
}

function ask(text) {
  question.value = text;
  sendMessage();
}

/* Sagalee galchuu */
function startVoiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusBox.textContent =
      "Browser kee sagalee galchuu hin deeggaru. Chrome yaali.";
    return;
  }

  if (isListening && recognition) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = {
    om: "om-ET",
    am: "am-ET",
    en: "en-US"
  }[language];

  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    isListening = true;
    micButton.classList.add("listening");
    micButton.textContent = "⏹";
    statusBox.textContent = "Amma dubbadhu... 🎤";
  };

  recognition.onresult = function(event) {
    const spokenText = event.results[0][0].transcript;
    question.value = spokenText;
    question.focus();
    statusBox.textContent = "Sagaleen galmaa'eera. Erguuf ➤ tuqi.";
  };

  recognition.onerror = function(event) {
    statusBox.textContent =
      "Sagalee galchuu irratti rakkoon uumame: " + event.error;
  };

  recognition.onend = function() {
    isListening = false;
    micButton.classList.remove("listening");
    micButton.textContent = "🎤";
  };

  try {
    recognition.start();
  } catch (error) {
    statusBox.textContent = "Sagalee jalqabuu hin dandeenye.";
    isListening = false;
    micButton.classList.remove("listening");
    micButton.textContent = "🎤";
  }
}

/* Deebii sagaleedhaan dubbisuu */
function speakLastAnswer() {
  if (!lastAnswer) {
    statusBox.textContent = "Deebiin dhaggeeffatamu hin jiru.";
    return;
  }

  if (!("speechSynthesis" in window)) {
    statusBox.textContent = "Browser kee dubbisa sagalee hin deeggaru.";
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(lastAnswer);

  speech.lang = {
    om: "om-ET",
    am: "am-ET",
    en: "en-US"
  }[language];

  speech.rate = 0.9;
  speech.pitch = 1;

  speech.onstart = function() {
    statusBox.textContent = "Tola AI dubbachaa jira... 🔊";
  };

  speech.onend = function() {
    statusBox.textContent = "Dubbisni xumurame.";
  };

  speech.onerror = function() {
    statusBox.textContent =
      "Sagaleen dubbisuu hin danda'amne.";
  };

  window.speechSynthesis.speak(speech);
}

async function sendMessage() {
  const text = question.value.trim();

  if (!text || busy) return;

  if (isListening && recognition) {
    recognition.stop();
  }

  document.getElementById("welcome").style.display = "none";
  document.getElementById("suggestions").style.display = "none";

  addMessage(text, "user");
  question.value = "";

  busy = true;
  sendButton.disabled = true;
  statusBox.textContent = "Gaaffii kee deebisaa jira...";

  const waiting = addMessage("Xiqqoo na eegi...", "ai");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        language: language,
        history: history.slice(-12)
      })
    });

    let data = {};

    try {
      data = await response.json();
    } catch (e) {}

    if (!response.ok) {
      throw new Error(
        data.details || data.error || "HTTP " + response.status
      );
    }

    const answer = data.reply || data.answer || data.text;

    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error("Deebii sirrii hin arganne.");
    }

    waiting.lastChild.textContent = answer;
    lastAnswer = answer;

    history.push(
      { role: "user", content: text },
      { role: "assistant", content: answer }
    );

    statusBox.textContent = "Deebiin qophaa'eera. 🔊";

  } catch (error) {
    waiting.lastChild.textContent =
      "Dhiifama, deebii argachuu hin dandeenye.\n\n" +
      "Sababa: " +
      (error.message || "Walqunnamtii serverii");

    statusBox.textContent = "Rakkoo walqunnamtii jira.";
    console.error(error);

  } finally {
    busy = false;
    sendButton.disabled = false;
    question.focus();
  }
}

question.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

</script>

</body>
</html>
