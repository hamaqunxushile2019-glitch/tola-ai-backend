<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>Tola Ai</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: #ffffff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  background: #101725;
  border-bottom: 1px solid #263449;
  padding: 17px 12px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(90deg,#38bdf8,#a78bfa,#facc15);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  color: #cbd5e1;
  font-size: 13px;
  margin-top: 5px;
}

main {
  max-width: 780px;
  margin: auto;
  padding: 13px;
}

.welcome {
  text-align: center;
  padding: 24px 8px;
}

.logo {
  font-size: 48px;
}

.welcome h2 {
  color: #38bdf8;
}

.welcome p {
  color: #cbd5e1;
  line-height: 1.7;
}

.languages,
.suggestions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
}

.languages button,
.suggestions button {
  background: #172235;
  color: #ffffff;
  border: 1px solid #354761;
  padding: 10px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.languages button.active {
  background: #0369a1;
  border-color: #38bdf8;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding-bottom: 15px;
}

.msg {
  max-width: 94%;
  padding: 14px;
  border-radius: 17px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 16px;
}

.user {
  align-self: flex-end;
  background: #075985;
  color: #ffffff;
}

.ai {
  align-self: flex-start;
  background: #172235;
  border: 1px solid #354761;
  color: #ffffff;
}

.label {
  color: #7dd3fc;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
}

.composer {
  position: sticky;
  bottom: 0;
  background: #080b12;
  padding: 10px 0;
  z-index: 5;
}

.inputbox {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  background: #000000;
  border: 1px solid #64748b;
  border-radius: 18px;
  padding: 8px;
  box-shadow: 0 0 12px #000000;
}

textarea {
  flex: 1;
  min-width: 0;
  min-height: 48px;
  max-height: 150px;
  resize: vertical;
  background: #000000;
  color: #ffffff;
  border: none;
  outline: none;
  padding: 13px 7px;
  font-size: 17px;
  font-family: Arial,sans-serif;
}

textarea::placeholder {
  color: #cbd5e1;
}

#send,
#micButton {
  border: none;
  border-radius: 13px;
  padding: 13px;
  font-size: 19px;
  cursor: pointer;
}

#send {
  background: #0284c7;
  color: #ffffff;
}

#send:disabled {
  opacity: 0.5;
}

#micButton {
  background: #25364e;
  color: white;
}

#micButton.listening {
  background: #b91c1c;
}

.status {
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  padding: 9px;
  line-height: 1.5;
}

.status.error {
  color: #fca5a5;
}

footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
  font-size: 12px;
}

@media(max-width:480px) {
  main {
    padding: 9px;
  }

  h1 {
    font-size: 27px;
  }

  .msg {
    max-width: 97%;
  }

  textarea {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Tola Ai</h1>
  <div class="subtitle">Gargaaraa Barnootaa fi Beekumsaa</div>
</header>

<main>

<section class="welcome" id="welcome">
  <div class="logo">📚✨</div>
  <h2>Baga Nagaan dhuftan!</h2>
  <p>
    Ani Tola Ai dha. Gaaffii kee na gaafadhu.
    Barnoota, saayinsii, herrega, seenaa fi
    wantoota hedduu irratti si gargaara.
  </p>
</section>

<div class="languages">
  <button class="active" data-lang="om" type="button">Afaan Oromoo</button>
  <button data-lang="am" type="button">አማርኛ</button>
  <button data-lang="en" type="button">English</button>
</div>

<div class="suggestions" id="suggestions">
  <button type="button" data-question="Saayinsiin maal jechuudha?">🔬 Saayinsii</button>
  <button type="button" data-question="Herrega na barsiisi">➗ Herrega</button>
  <button type="button" data-question="Seenaa na barsiisi">📚 Seenaa</button>
  <button type="button" data-question="English na barsiisi">🌍 Afaan</button>
</div>

<section id="chat" aria-live="polite"></section>

<div class="status" id="status">
  Gaaffii kee barreessi ykn 🎙️ tuqiitii dubbadhu.
</div>

<div class="composer">
  <div class="inputbox">

    <textarea
      id="question"
      placeholder="Tola Ai gaafadhu..."
      rows="1"
      aria-label="Gaaffii barreessi"
    ></textarea>

    <button id="micButton" type="button" aria-label="Sagalee">
      🎙️
    </button>

    <button id="send" type="button" aria-label="Ergi">
      ➤
    </button>

  </div>
</div>

</main>

<footer>
  Tola Ai © 2026
</footer>

<script>
'use strict';

// API URL duraanii eeggadheera
const API_URL =
  'https://tola-ai-chat-2026.hamaqunxushile2019.workers.dev/';

const chat = document.getElementById('chat');
const question = document.getElementById('question');
const sendButton = document.getElementById('send');
const micButton = document.getElementById('micButton');
const statusBox = document.getElementById('status');

let language = 'om';
let history = [];
let busy = false;
let recognition = null;
let isListening = false;
let voiceMode = false;

const speechLanguages = {
  om: 'om-ET',
  am: 'am-ET',
  en: 'en-US'
};

const messages = {
  om: {
    placeholder: 'Tola Ai gaafadhu...',
    waiting: 'Gaaffii kee deebisaa jira...',
    ready: 'Deebiin qophaaʼeera.',
    listening: 'Amma dubbadhu...',
    failed: 'Rakkoo walqunnamtii uumame. Irra deebiʼi.',
    voiceUnsupported: 'Microphone browser kanaan hin deeggaramu. Gboard fayyadami.'
  },
  am: {
    placeholder: 'Tola Aiን ይጠይቁ...',
    waiting: 'ጥያቄዎን እየመለስኩ ነው...',
    ready: 'መልሱ ዝግጁ ነው።',
    listening: 'አሁን ይናገሩ...',
    failed: 'የግንኙነት ችግር ተፈጥሯል።',
    voiceUnsupported: 'የድምፅ መቀበያው አይደገፍም። Gboard ይጠቀሙ።'
  },
  en: {
    placeholder: 'Ask Tola Ai...',
    waiting: 'Preparing your answer...',
    ready: 'Your answer is ready.',
    listening: 'Listening...',
    failed: 'Connection problem. Please try again.',
    voiceUnsupported: 'Voice recognition is not supported. Try Gboard.'
  }
};

function setStatus(text, error = false) {
  statusBox.textContent = text;
  statusBox.className = error ? 'status error' : 'status';
}

function setLanguage(lang) {
  language = lang;

  document.querySelectorAll('.languages button')
    .forEach(button => {
      button.classList.toggle(
        'active',
        button.dataset.lang === lang
      );
    });

  question.placeholder = messages[lang].placeholder;

  setStatus(
    lang === 'om' ? 'Afaan Oromoo filatte.' :
    lang === 'am' ? 'አማርኛ መርጠዋል።' :
    'English selected.'
  );

  if (recognition) {
    recognition.lang = speechLanguages[lang];
  }
}

document.querySelectorAll('.languages button')
  .forEach(button => {
    button.addEventListener('click', () => {
      setLanguage(button.dataset.lang);
    });
  });

document.querySelectorAll('.suggestions button')
  .forEach(button => {
    button.addEventListener('click', () => {
      question.value = button.dataset.question;
      sendMessage();
    });
  });

function addMessage(text, type) {
  const box = document.createElement('div');
  box.className = 'msg ' + type;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = type === 'user' ? 'Ati' : 'Tola Ai';

  const content = document.createElement('div');
  content.textContent = text;

  box.append(label, content);
  chat.appendChild(box);

  box.scrollIntoView({
    behavior: 'smooth',
    block: 'end'
  });

  return box;
}

// Deebii sagaleedhaan dubbisuu
function speakAnswer(text) {
  if (!voiceMode) return;

  if (!('speechSynthesis' in window)) {
    setStatus('Bilbilli kee dubbisa sagalee hin deeggaru.');
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = speechLanguages[language];
  speech.rate = 1;
  speech.pitch = 1;

  speech.onstart = () => {
    setStatus('Tola Ai deebii dubbisaa jira...');
  };

  speech.onend = () => {
    setStatus(messages[language].ready);
  };

  speech.onerror = () => {
    setStatus(
      'Dubbisa sagalee hin milkoofne. Barreeffamaan deebii argatte.'
    );
  };

  window.speechSynthesis.speak(speech);
}

// Sagalee dhaggeeffachuu
function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    question.focus();
    setStatus(messages[language].voiceUnsupported);
    return;
  }

  if (isListening && recognition) {
    recognition.stop();
    return;
  }

  if (busy) {
    setStatus('Deebii duraa eegi.');
    return;
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  recognition = new SpeechRecognition();

  recognition.lang = speechLanguages[language];
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    voiceMode = true;
    micButton.classList.add('listening');
    micButton.textContent = '⏹️';
    setStatus(messages[language].listening);
  };

  recognition.onresult = event => {
    const spokenText =
      event.results[0][0].transcript.trim();

    if (spokenText) {
      question.value = spokenText;
      setStatus('Dubbii kee hubadhe. Deebisaa jira...');
      sendMessage();
    }
  };

  recognition.onerror = event => {
    if (event.error === 'not-allowed') {
      setStatus('Microphone permission Allow godhi.', true);
    } else {
      setStatus(
        'Microphone rakkoo qaba. Gboard voice typing yaali.',
        true
      );
    }
  };

  recognition.onend = () => {
    isListening = false;
    micButton.classList.remove('listening');
    micButton.textContent = '🎙️';
  };

  try {
    recognition.start();
  } catch (error) {
    isListening = false;
    micButton.classList.remove('listening');
    micButton.textContent = '🎙️';
    setStatus('Microphone jalqabuu hin dandeenye.', true);
  }
}

micButton.addEventListener('click', startVoice);

// Gaaffii gara serveritti erguu
async function sendMessage() {
  const text = question.value.trim();

  if (!text || busy) return;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('suggestions').style.display = 'none';

  addMessage(text, 'user');
  question.value = '';

  busy = true;
  sendButton.disabled = true;

  setStatus(messages[language].waiting);

  const waiting = addMessage('Xiqqoo na eegi...', 'ai');

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 100000);

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: text,
        language: language,
        history: history.slice(-12)
      }),
      signal: controller.signal
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.details ||
        'Server error: ' + response.status
      );
    }

    const answer =
      data.reply || data.answer || data.text;

    if (!answer || typeof answer !== 'string') {
      throw new Error('Deebii sirrii hin arganne.');
    }

    waiting.lastChild.textContent = answer;

    history.push(
      { role: 'user', content: text },
      { role: 'assistant', content: answer }
    );

    history = history.slice(-12);

    setStatus(messages[language].ready);

    // Voice mode yoo fayyadamaa jirte deebii dubbisi
    speakAnswer(answer);

  } catch (error) {
    console.error('Tola Ai error:', error);

    let errorText = error.message || messages[language].failed;

    if (error.name === 'AbortError') {
      errorText = 'Server yeroo dheeraa fudhate. Irra deebiʼi.';
    }

    waiting.lastChild.textContent =
      'Dhiifama, deebii argachuu hin dandeenye.\nSababa: ' +
      errorText;

    question.value = text;
    setStatus(messages[language].failed, true);

  } finally {
    clearTimeout(timeout);
    busy = false;
    sendButton.disabled = false;
  }
}

sendButton.addEventListener('click', sendMessage);

question.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

</script>
</body>
</html>
