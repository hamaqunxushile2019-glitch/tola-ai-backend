<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Tola Ai</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#101827;color:#f1f5f9;font-family:Arial,sans-serif;font-size:17px;min-height:100vh}
header{background:#17243a;padding:15px;display:flex;align-items:center;justify-content:center;gap:12px;border-bottom:1px solid #334155;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:30px;font-weight:800;background:linear-gradient(90deg,#22d3ee,#a78bfa,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.sub{font-size:13px;color:#cbd5e1;margin-top:5px;text-align:center}
main{max-width:760px;margin:auto;padding:15px}
.welcome{text-align:center;padding:25px 8px}
.robot{font-size:48px}
h2{color:#38bdf8}
.welcome p{color:#cbd5e1;line-height:1.7}
.languages,.suggestions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}
button{cursor:pointer;font:inherit}
.languages button,.suggestions button{background:#1e293b;color:white;border:1px solid #475569;padding:10px 13px;border-radius:20px}
.languages button.active{background:#0284c7}
#chat{display:flex;flex-direction:column;gap:13px;padding-bottom:15px}
.msg{padding:13px 15px;border-radius:17px;max-width:92%;white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#075985}
.ai{align-self:flex-start;background:#1e293b;border:1px solid #334155}
.label{font-size:12px;color:#7dd3fc;margin-bottom:6px}
.composer{position:sticky;bottom:0;background:#101827;padding:10px 0 8px;z-index:4}
.inputbox{display:flex;gap:8px;align-items:flex-end;background:#1e293b;border:1px solid #475569;border-radius:18px;padding:8px}
textarea{background:transparent;color:white;border:0;outline:0;resize:vertical;min-height:48px;max-height:160px;flex:1;font:17px Arial;padding:10px 4px;min-width:0}
textarea::placeholder{color:#94a3b8}
#send{border:0;border-radius:13px;background:#0284c7;color:white;padding:13px 16px;font-size:17px}
#send:disabled{opacity:.5;cursor:wait}
.mic{border:1px solid #475569;border-radius:13px;background:#334155;color:white;padding:12px;font-size:18px}
.status{text-align:center;padding:9px;color:#94a3b8;font-size:13px;line-height:1.5}
.status.error{color:#fca5a5}
footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
@media(max-width:480px){
 main{padding:10px}
 h1{font-size:28px}
 .inputbox{gap:5px;padding:6px}
 #send,.mic{padding:11px 12px}
 textarea{font-size:16px}
}
</style>
</head>
<body>

<header>
 <div>
  <h1>Tola AI</h1>
  <div class="sub">Gargaaraa Barnootaa</div>
 </div>
</header>

<main>
<section class="welcome" id="welcome">
 <div class="robot">📚✨</div>
 <h2>Baga Nagaan dhufte!</h2>
 <p>Waan barbaadde na gaafadhu!</p>
</section>

<div class="languages">
 <button class="active" type="button" onclick="setLanguage('om',this)">Afaan Oromoo</button>
 <button type="button" onclick="setLanguage('am',this)">አማርኛ</button>
 <button type="button" onclick="setLanguage('en',this)">English</button>
</div>

<div class="suggestions" id="suggestions">
 <button type="button" onclick="ask('Saayinsiin maal jechuudha?')">🔬 Saayinsii</button>
 <button type="button" onclick="ask('Herrega na barsiisi')">➗ Herrega</button>
 <button type="button" onclick="ask('Seenaa na barsiisi')">📚 Seenaa</button>
 <button type="button" onclick="ask('English na barsiisi')">🌍 Afaan</button>
</div>

<section id="chat" aria-live="polite"></section>

<div class="status" id="status" role="status">
 Gaaffii kee barreessi ykn 🎙️ Gboard fayyadami.
</div>

<div class="composer">
 <div class="inputbox">
  <textarea id="question" placeholder="Tola AI gaafadhu..." rows="1" aria-label="Gaaffii kee barreessi"></textarea>
  <button class="mic" id="micButton" type="button" aria-label="Bakka barreessuu bani">🎙️</button>
  <button id="send" type="button">➤</button>
 </div>
</div>
</main>

<footer>Tola Ai © Hama 2026</footer>

<script>
'use strict';

const API_URL='https://tola-ai-chat-2026.hamaqunxushile2019.workers.dev/';

const chat=document.getElementById('chat');
const question=document.getElementById('question');
const sendButton=document.getElementById('send');
const statusBox=document.getElementById('status');

let language='om';
let history=[];
let busy=false;

function setLanguage(lang,button){
 language=lang;

 document.querySelectorAll('.languages button')
 .forEach(b=>b.classList.remove('active'));

 if(button)button.classList.add('active');

 question.placeholder={
  om:'Tola Ai gaafadhu...',
  am:'Tola AIን ይጠይቁ...',
  en:'Ask Tola Ai...'
 }[lang];

 statusBox.textContent={
  om:'Afaan Oromoo filatte.',
  am:'አማርኛ መርጠዋል።',
  en:'English selected.'
 }[lang];

 question.focus();
}

function addMessage(text,type){
 const box=document.createElement('div');
 box.className='msg '+type;

 const label=document.createElement('div');
 label.className='label';
 label.textContent=type==='user'?'Ati':'Tola AI';

 const content=document.createElement('div');
 content.textContent=text;

 box.append(label,content);
 chat.appendChild(box);

 box.scrollIntoView({behavior:'smooth',block:'end'});

 return box;
}

function ask(text){
 question.value=text;
 sendMessage();
}

function showError(message){
 statusBox.textContent=message;
 statusBox.className='status error';
}

async function sendMessage(){

 const text=question.value.trim();

 if(!text||busy)return;

 document.getElementById('welcome').style.display='none';
 document.getElementById('suggestions').style.display='none';

 addMessage(text,'user');

 question.value='';

 busy=true;
 sendButton.disabled=true;

 statusBox.className='status';
 statusBox.textContent='Gaaffii kee deebisaa jira...';

 const waiting=addMessage('Xiqqoo na eegi...','ai');

 try{

  const response=await fetch(API_URL,{
   method:'POST',
   headers:{
    'Content-Type':'application/json'
   },
   body:JSON.stringify({
    message:text,
    language:language,
    history:history.slice(-12)
   })
  });

  let data={};

  try{
   data=await response.json();
  }catch(parseError){
   throw new Error('Deebiin server irraa dhufe JSON sirrii miti.');
  }

  if(!response.ok){
   throw new Error(data.details||data.error||('HTTP '+response.status));
  }

  if(data.error){
   throw new Error(data.error);
  }

  const answer=data.reply||data.answer||data.text;

  if(typeof answer!=='string'||!answer.trim()){
   throw new Error('Deebii sirrii hin arganne.');
  }

  waiting.lastChild.textContent=answer;

  history.push(
   {role:'user',content:text},
   {role:'assistant',content:answer}
  );

  history=history.slice(-12);

  statusBox.textContent='Deebiin qophaaʼeera.';

 }catch(error){

  waiting.lastChild.textContent=
   'Dhiifama, deebii argachuu hin dandeenye.\nSababa: '+
   (error.message||'Walqunnamtii serverii');

  question.value=text;

  showError('Rakkoo walqunnamtii jira. Gaaffii kee irra deebiʼii ergi.');

  console.error('Tola AI error:',error);

 }finally{

  busy=false;
  sendButton.disabled=false;

 }
}

// Gboard voice typing
document.getElementById('micButton').addEventListener('click',()=>{

 question.focus();

 statusBox.className='status';

 statusBox.textContent=
 'Gboard irratti 🎙️ tuqi; dubbadhu. Barruun asitti galma. Erguuf ➤ tuqi.';

});

sendButton.addEventListener('click',sendMessage);

question.addEventListener('keydown',event=>{

 if(event.key==='Enter'&&!event.shiftKey){
  event.preventDefault();
  sendMessage();
 }

});

</script>
</body>
    </html>
