
<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a2b">
<title>Tola AI</title>
<style>
:root {
  --bg:#071a2b;
  --panel:#102b40;
  --accent:#42e6c4;
  --text:#f2f8ff;
  --muted:#a9c0d2;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:18px;
  min-height:100vh;
  background:radial-gradient(circle at top,#16445a,var(--bg) 60%);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.app { max-width:650px; margin:auto; }
header { text-align:center; padding:22px 8px; }
.logo {
  width:72px;height:72px;border-radius:24px;
  display:grid;place-items:center;margin:auto;
  background:linear-gradient(135deg,#42e6c4,#47a7ff);
  color:#071a2b;font-size:36px;font-weight:bold;
  box-shadow:0 8px 30px #42e6c433;
}
h1 { margin:12px 0 4px;color:var(--accent); }
header p { margin:0;color:var(--muted); }
.card {
  background:#102b40eF;
  border:1px solid #ffffff16;
  border-radius:20px;padding:18px;margin:14px 0;
  box-shadow:0 12px 35px #0002;
}
label { display:block;font-weight:bold;margin:12px 0 7px; }
select,textarea,button {
  width:100%;padding:14px;border-radius:12px;
  font-size:16px;
}
select,textarea {
  color:var(--text);background:#071a2b;
  border:1px solid #31536b;
}
textarea { min-height:120px;resize:vertical; }
button {
  border:0;background:var(--accent);color:#071a2b;
  font-weight:bold;cursor:pointer;margin-top:12px;
}
button:disabled { opacity:.5;cursor:not-allowed; }
.secondary { background:#203e55;color:var(--text); }
.actions { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
#answer {
  min-height:90px;white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.75;color:var(--text);
}
.small { color:var(--muted);font-size:13px;text-align:center; }
footer { text-align:center;color:var(--muted);padding:18px;font-size:13px; }
@media(max-width:380px) {
  body { padding:10px; }
  .card { padding:13px; }
  .actions { grid-template-columns:1fr; }
}
@media print {
  body { background:white;color:black; }
  .no-print,header,.card:first-of-type,footer { display:none!important; }
  .card { background:white;border:0;box-shadow:none; }
  #answer { color:black; }
}
</style>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">T</div>
    <h1>Tola AI</h1>
    <p>🌟 Gargaaraa barnootaa kee</p>
  </header>

  <section class="card no-print">
    <label for="language">🌍 Afaan filadhu</label>
    <select id="language">
      <option>Afaan Oromoo</option>
      <option>Amharic</option>
      <option>English</option>
    </select>

    <label for="message">💬 Gaaffii kee</label>
    <textarea id="message"
      placeholder="Gaaffii kee asitti barreessi..."></textarea>

    <button id="ask" onclick="askAI()">➤ Gaaffii ergi</button>
    <p class="small">Afaan sadiin gaaffii gaafachuu dandeessa.</p>
  </section>

  <section class="card">
    <h3>🤖 Deebii Tola AI</h3>
    <div id="answer" aria-live="polite">Deebiin kee asitti mul'ata.</div>
    <div class="actions no-print">
      <button id="pdfButton" class="secondary"
        onclick="downloadPDF()" disabled>📄 PDF buufadhu</button>
      <button id="wordButton" class="secondary"
        onclick="downloadDOCX()" disabled>📝 Word buufadhu</button>
    </div>
    <p id="status" class="small no-print">Gaaffii kee ergi.</p>
  </section>

  <footer>© Tola AI · Barnootaaf jaalalaan hojjetame ❤️</footer>
</div>

<script>
let currentAnswer = "";
let currentQuestion = "";
let currentLanguage = "";

async function askAI() {
  const message = document.getElementById("message").value.trim();
  const language = document.getElementById("language").value;
  const answer = document.getElementById("answer");
  const button = document.getElementById("ask");
  const status = document.getElementById("status");

  if (!message) {
    answer.textContent = "Maaloo gaaffii kee barreessi.";
    return;
  }

  button.disabled = true;
  document.getElementById("pdfButton").disabled = true;
  document.getElementById("wordButton").disabled = true;
  answer.textContent = "Deebii barbaadaa jira...";
  status.textContent = "Mee xiqqoo eegi.";

  try {
    const response = await fetch(
      "https://tola-ai-chat-2026.hamaqunxushile2019.workers.dev",
      {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message, language})
      }
    );

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    if (typeof data.answer !== "string" || !data.answer) {
      throw new Error("Deebiin hin argamne.");
    }

    currentAnswer = data.answer;
    currentQuestion = message;
    currentLanguage = language;
    answer.textContent = currentAnswer;
    document.getElementById("pdfButton").disabled = false;
    document.getElementById("wordButton").disabled = false;
    status.textContent = "Deebiin qophaa'eera. Faayila buufadhu.";
  } catch (error) {
    answer.textContent = "Deebii argachuu hin dandeenye. Internet ilaali.";
    status.textContent = "Rakkoo uumame; irra deebi'ii yaali.";
  } finally {
    button.disabled = false;
  }
}

function downloadPDF() {
  if (!currentAnswer) return;
  const w = window.open("", "_blank");
  if (!w) {
    alert("Pop-up browser keessatti hayyami, achiis irra deebi'i.");
    return;
  }

  const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);

  w.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8"><title>Tola AI</title>
    <style>body{font-family:Arial;margin:32px;line-height:1.7}
    .answer{white-space:pre-wrap;overflow-wrap:anywhere}</style>
    </head><body><h1>Tola AI</h1>
    <p><b>Afaan:</b> ${escapeHTML(currentLanguage)}</p>
    <p><b>Gaaffii:</b> ${escapeHTML(currentQuestion)}</p>
    <hr><h2>Deebii</h2>
    <div class="answer">${escapeHTML(currentAnswer)}</div>
    <script>window.onload=()=>setTimeout(()=>window.print(),400);<\/script>
    </body></html>`);
  w.document.close();
}

async function downloadDOCX() {
  if (!currentAnswer) return;
  const status = document.getElementById("status");

  try {
    if (!window.docx) throw new Error("Library Word hin banamne.");
    const {Document,Packer,Paragraph,TextRun} = window.docx;
    const children = [
      new Paragraph({children:[new TextRun({text:"Tola AI",bold:true,size:32})]}),
      new Paragraph({children:[new TextRun({text:"Afaan: "+currentLanguage,bold:true})]}),
      new Paragraph({children:[new TextRun({text:"Gaaffii: "+currentQuestion,bold:true})]}),
      new Paragraph({text:""}),
      ...currentAnswer.split(/\r?\n/).map(line => new Paragraph({children:[new TextRun(line)]}))
    ];
    const doc = new Document({sections:[{children}]});
    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Tola-AI-Deebii.docx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    status.textContent = "Faayilli Word qophaa'eera.";
  } catch (error) {
    status.textContent = "Word uumuu hin dandeenye. Internet ilaali.";
  }
}
</script>
</body>
</html>
